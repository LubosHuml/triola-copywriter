services:
  - type: web
    name: triola-copywriter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --preload --worker-tmp-dir /dev/shm
    envVars:
      - key: OPENAI_API_KEY
        sync: false
        placeholder: "Vložte váš OpenAI API klíč (sk-proj-...)"
      - key: ANTHROPIC_API_KEY
        sync: false
        placeholder: "Vložte váš Anthropic API klíč (sk-ant-...)"
      - key: GOOGLE_API_KEY
        sync: false
        placeholder: "Vložte váš Google API klíč (AIzaSy...)"
